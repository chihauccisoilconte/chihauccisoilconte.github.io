
<div id="sidebar">

<a class="sidebar-logo-link" href="/"><img class="side-logo" src="/img/logo.png" alt="Chi ha ucciso il Conte? — Home"></a>
  <header>
    <{% if page.layout == "index" %}h1{% else %}div{% endif %} class="site-title">
      <a href="{{ site.baseurl }}/">
        {% unless page.url == "/" %}
          <span class="back-arrow icon">{% include svg/back-arrow.svg %}</span>
        {% endunless %}
      </a>
    </{% if page.layout == "index" %}h1{% else %}div{% endif %}>
    <p class="lead">{{ site.description }}</p>
  </header>

  {% include sidebar-nav-links.html %}

  <div class="language-switcher" role="group" aria-label="Website language" hidden>
    <button type="button" data-language="en" lang="en" aria-pressed="true">English</button>
    <span aria-hidden="true">/</span>
    <button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">简体中文</button>
  </div>

  <p class="translation-disclaimer" lang="zh-CN" translate="no">AI 翻译，可能有误。我不会中文，请用英语联系我 <span class="disclaimer-emoji" aria-hidden="true">😅</span></p>
 

  {% include sidebar-icon-links.html %}
 
</div>
